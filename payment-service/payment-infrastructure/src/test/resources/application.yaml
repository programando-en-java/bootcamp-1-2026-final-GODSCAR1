spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration,classpath:db/testdata

# Nothing answers here. Tests that exercise the outbound call mock the port; the
# address is present so the Feign client can be built at all.
airline:
  booking-service:
    url: http://localhost:0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.flywaydb: info
