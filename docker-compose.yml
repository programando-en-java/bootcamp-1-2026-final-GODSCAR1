# The service images copy a jar that Maven has already built, so run
#   ./mvnw -B clean package
# before docker compose build, or you will ship yesterday's jar.

services:

  flight-db:
    image: postgres:17-alpine
    container_name: airline-flight-db
    environment:
      POSTGRES_USER: airline
      POSTGRES_PASSWORD: airline
      POSTGRES_DB: airline_flight
    # Only the host port differs between the databases, so that all of them can
    # be reached from a laptop. Inside the network they are all on 5432.
    ports:
      - "5433:5432"
    volumes:
      - flight-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U airline -d airline_flight" ]
      interval: 5s
      timeout: 5s
      retries: 5

  booking-db:
    image: postgres:17-alpine
    container_name: airline-booking-db
    environment:
      POSTGRES_USER: airline
      POSTGRES_PASSWORD: airline
      POSTGRES_DB: airline_booking
    ports:
      - "5434:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U airline -d airline_booking" ]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-db:
    image: postgres:17-alpine
    container_name: airline-payment-db
    environment:
      POSTGRES_USER: airline
      POSTGRES_PASSWORD: airline
      POSTGRES_DB: airline_payment
    ports:
      - "5435:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U airline -d airline_payment" ]
      interval: 5s
      timeout: 5s
      retries: 5

  checkin-db:
    image: postgres:17-alpine
    container_name: airline-checkin-db
    environment:
      POSTGRES_USER: airline
      POSTGRES_PASSWORD: airline
      POSTGRES_DB: airline_checkin
    ports:
      - "5436:5432"
    volumes:
      - checkin-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U airline -d airline_checkin" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.1.0
    container_name: airline-kafka
    environment:
      # KRaft: one process that is both broker and controller. ZooKeeper stopped
      # being required in Kafka 4, and one container is enough for a laptop.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      # Two advertised listeners because the right address depends on where the
      # client stands: kafka:9092 from inside the network, localhost:29092 from
      # the host. One value cannot be correct for both.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # One broker, so nothing can be replicated further than itself.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1" ]
      interval: 5s
      timeout: 10s
      retries: 15

  flight-service:
    build: ./flight-service/flight-infrastructure
    container_name: airline-flight
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://flight-db:5432/airline_flight
    ports:
      - "8081:8081"
    depends_on:
      flight-db:
        condition: service_healthy
    healthcheck:
      # wget, not curl: Alpine has the first and not the second.
      test: [ "CMD", "wget", "-qO-", "http://localhost:8081/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 10

  booking-service:
    build: ./booking-service/booking-infrastructure
    container_name: airline-booking
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://booking-db:5432/airline_booking
      # airline.flight-service.url, as an environment variable. The hyphen in
      # the middle is not a typo: Spring relaxes the binding, and there is no
      # spelling without it that maps back to the same property.
      AIRLINE_FLIGHT-SERVICE_URL: http://flight-service:8081
      SPRING_KAFKA_BOOTSTRAP-SERVERS: kafka:9092
    ports:
      - "8082:8082"
    depends_on:
      booking-db:
        condition: service_healthy
      # service_healthy, not service_started: booking's first request would fail
      # against a flight-service that is up but not yet listening.
      flight-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8082/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-service:
    build: ./payment-service/payment-infrastructure
    container_name: airline-payment
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-db:5432/airline_payment
      AIRLINE_BOOKING-SERVICE_URL: http://booking-service:8082
      SPRING_KAFKA_BOOTSTRAP-SERVERS: kafka:9092
    ports:
      - "8083:8083"
    depends_on:
      payment-db:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8083/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 10

  checkin-service:
    build: ./checkin-service/checkin-infrastructure
    container_name: airline-checkin
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://checkin-db:5432/airline_checkin
      AIRLINE_BOOKING-SERVICE_URL: http://booking-service:8082
      AIRLINE_FLIGHT-SERVICE_URL: http://flight-service:8081
    ports:
      - "8084:8084"
    depends_on:
      checkin-db:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      flight-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8084/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flight-db-data:
  booking-db-data:
  payment-db-data:
  checkin-db-data:
  kafka-data:
