server:
  port: 8082

spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:postgresql://localhost:5432/airline_booking
    username: airline
    password: airline

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  threads:
    virtual:
      enabled: true

  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: booking-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # earliest, so a consumer joining a topic that already has messages picks
      # them up rather than skipping to whatever arrives next.
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # The relay marks a row sent only after the broker says it has it, and
      # acks=all is what makes that answer mean something.
      acks: all

airline:
  flight-service:
    url: http://localhost:8081
  outbox:
    poll-interval: PT1S

resilience4j:
  retry:
    instances:
      flightService:
        maxAttempts: 3
        waitDuration: 200ms
        ignoreExceptions:
          - com.programandoenjava.airline.booking.application.port.out.holdseats.exception.SeatsUnavailableException
          - com.programandoenjava.airline.booking.application.port.out.holdseats.exception.FlightNotBookableException
          - com.programandoenjava.airline.booking.application.port.out.holdseats.exception.FlightNotFoundException
  circuitbreaker:
    instances:
      flightService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        ignoreExceptions:
          - com.programandoenjava.airline.booking.application.port.out.holdseats.exception.SeatsUnavailableException
          - com.programandoenjava.airline.booking.application.port.out.holdseats.exception.FlightNotBookableException
          - com.programandoenjava.airline.booking.application.port.out.holdseats.exception.FlightNotFoundException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
