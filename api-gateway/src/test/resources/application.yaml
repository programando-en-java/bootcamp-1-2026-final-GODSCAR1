spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Never fetched: no test presents a real token, and the chain only
          # needs the decoder bean to exist to be built.
          jwk-set-uri: http://localhost:0/.well-known/jwks.json

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: nowhere
              uri: http://localhost:0
              predicates:
                - Path=/api/v1/**
