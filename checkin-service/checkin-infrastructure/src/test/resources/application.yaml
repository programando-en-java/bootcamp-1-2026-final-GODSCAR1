spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration,classpath:db/testdata

# Nothing answers here. Tests that exercise the outbound calls mock the ports;
# the addresses are present so the Feign clients can be built at all.
airline:
  booking-service:
    url: http://localhost:0
  flight-service:
    url: http://localhost:0
  checkin:
    opens-before: PT24H
    closes-before: PT1H

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.flywaydb: info
