server:
  port: 8084

spring:
  application:
    name: checkin-service

  datasource:
    url: jdbc:postgresql://localhost:5436/airline_checkin
    username: airline
    password: airline

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  threads:
    virtual:
      enabled: true

  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # The relay marks a row sent only after the broker says it has it, and
      # acks=all is what makes that answer mean something.
      acks: all

airline:
  booking-service:
    url: http://localhost:8082
  flight-service:
    url: http://localhost:8081
  outbox:
    poll-interval: PT1S
  checkin:
    # The usual airline window. Both are distances from departure, so the rule
    # reads the same for every flight.
    opens-before: PT24H
    closes-before: PT1H

resilience4j:
  retry:
    instances:
      bookingService:
        maxAttempts: 3
        waitDuration: 200ms
        ignoreExceptions:
          - com.programandoenjava.airline.checkin.application.port.out.readbooking.exception.BookingNotFoundException
      flightService:
        maxAttempts: 3
        waitDuration: 200ms
        ignoreExceptions:
          - com.programandoenjava.airline.checkin.application.port.out.readflight.exception.FlightNotFoundException
  circuitbreaker:
    instances:
      bookingService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        ignoreExceptions:
          - com.programandoenjava.airline.checkin.application.port.out.readbooking.exception.BookingNotFoundException
      flightService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        ignoreExceptions:
          - com.programandoenjava.airline.checkin.application.port.out.readflight.exception.FlightNotFoundException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
