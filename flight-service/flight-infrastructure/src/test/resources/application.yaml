spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Never fetched: no test presents a real token, and the filter chain
          # only needs the decoder bean to exist to be built.
          jwk-set-uri: http://localhost:0/.well-known/jwks.json
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration,classpath:db/testdata

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.flywaydb: info

airline:
  service-tokens:
    booking-service: a-token-for-tests
