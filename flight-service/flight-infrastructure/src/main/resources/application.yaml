server:
  port: 8081

spring:
  application:
    name: flight-service

  datasource:
    url: jdbc:postgresql://localhost:5432/airline_flight
    username: airline
    password: airline

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks the mapping matches it.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  threads:
    virtual:
      enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8086/.well-known/jwks.json

airline:
  service-tokens:
    booking-service: ${BOOKING_SERVICE_TOKEN}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
